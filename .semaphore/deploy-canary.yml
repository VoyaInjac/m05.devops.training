version: v1.0
name: Deploy Canary
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2204

blocks:
  - name: Deploy Canary
    task:
      jobs:
        - name: kubectl apply canary
          commands:
            - checkout
            - cd 3-canary-deployment
            - kubectl create namespace g3 || true
            - kubectl config set-context --current --namespace=g3
            - kubectl apply -f deployment-canary.yml
            - kubectl rollout status deployment/flask-app-canary
      secrets:
        - name: kubeconfig

  - name: Verify Canary
    task:
      jobs:
        - name: Check service
          commands:
            - kubectl config set-context --current --namespace=g3
            - kubectl get svc flask-app
      secrets:
        - name: kubeconfig
