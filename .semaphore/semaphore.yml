version: v1.0
name: Flask Kubernetes Deploy
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2204
blocks:
  - name: Build and Push Image
    task:
      jobs:
        - name: Docker build and push
          commands:
            - checkout
            - cd 1-deployment
            - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            - 'docker build -t "$DOCKER_USERNAME/my-flask-image:latest" .'
            - 'docker push "$DOCKER_USERNAME/my-flask-image:latest"'
      secrets:
        - name: DOCKER_vinjac
  - name: Deploy to Kubernetes
    task:
      secrets:
        - name: DOCKER_vinjac
        - name: kubeconfig
      jobs:
        - name: kubectl apply
          commands:
            - checkout
            - cd 1-deployment
            - echo "$KUBECONFIG_BASE64" | base64 -d > /tmp/kubeconfig
            - export KUBECONFIG=/tmp/kubeconfig
            - kubectl config use-context $(kubectl config get-contexts -o name | head -1)
            - kubectl create namespace g3 || true
            - kubectl config set-context --current --namespace=g3
            - kubectl apply -f deployment.yml
            - kubectl apply -f service.yml
            - kubectl rollout status deployment/flask-app
  - name: Verify
    task:
      secrets:
        - name: kubeconfig
      jobs:
        - name: Check service
          commands:
            - echo "$KUBECONFIG_BASE64" | base64 -d > /tmp/kubeconfig
            - export KUBECONFIG=/tmp/kubeconfig
            - kubectl config use-context $(kubectl config get-contexts -o name | head -1)
            - kubectl config set-context --current --namespace=g3
            - kubectl get svc flask-app
