version: v1.0
name: Flask Kubernetes Deploy
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Build and Push Image
    task:
      jobs:
        - name: Docker build and push
          commands:
            - checkout
            - cd 1-deployment
            - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            - 'docker build -t "$DOCKERHUB_USERNAME/my-flask-image:latest" .'
            - 'docker push "$DOCKERHUB_USERNAME/my-flask-image:latest"'
  - name: Deploy to Kubernetes
    task:
      secrets:
        - name: dockerhub
        - name: kubeconfig
      jobs:
        - name: kubectl apply
          commands:
            - checkout
            - cd 1-deployment
            - echo "$KUBECONFIG_BASE64" | base64 -d > /tmp/kubeconfig
            - export KUBECONFIG=/tmp/kubeconfig
            - kubectl create namespace g3 || true
            - kubectl config set-context --current --namespace=g3
            - kubectl apply -f deployment.yml
            - kubectl apply -f service.yml
            - kubectl rollout status deployment/flask-app
  - name: Verify
    task:
      secrets:
        - name: kubeconfig
      jobs:
        - name: Check service
          commands:
            - echo "$KUBECONFIG_BASE64" | base64 -d > /tmp/kubeconfig
            - export KUBECONFIG=/tmp/kubeconfig
            - kubectl config set-context --current --namespace=g3
            - kubectl get svc flask-app
