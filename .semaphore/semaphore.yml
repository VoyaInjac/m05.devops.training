version: v1.0
name: Flask Kubernetes Deploy
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2204
blocks:
  - name: Build and Push Image
    task:
      jobs:
        - name: Docker build and push
          commands:
            - checkout
            - cd 2-blue-green-deployment
            - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            - docker build -t "$DOCKER_USERNAME/my-flask-image:latest" .
            - docker push "$DOCKER_USERNAME/my-flask-image:latest"
      secrets:
        - name: DOCKER_vinjac
  - name: Deploy to Kubernetes
    task:
      jobs:
        - name: kubectl apply
          commands:
            - checkout
            - cd 2-blue-green-deployment
            - kubectl create namespace g3 || true
            - kubectl config set-context --current --namespace=g3
            - kubectl apply -f deployment-blue.yml
            - kubectl apply -f service-blue.yml
            - kubectl rollout status deployment/flask-app-blue
      secrets:
        - name: kubeconfig
  - name: Verify
    task:
      secrets:
        - name: kubeconfig
      jobs:
        - name: Check service
          commands:
            - kubectl config set-context --current --namespace=g3
            - kubectl get svc flask-app

promotions:
  - name: Deploy Green
    pipeline_file: deploy-green.yml
